<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* css页面整体样式 */
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background-color: #f0f0f0;
            font-family:Arial, sans-serif;

        }
        /* cssmainButton选择器样式 */
        #mainButton{
            padding:10px 20px;
            font-size:20px;
            cursor:pointer;
        }
        /* cssnewPage选择器样式（页面容器） */
        #newPage{
            display:none;
            flex-direction:column;
            align-items:center;
            gap:20px;

        }
        /* canvas选择器样式 */
        #canvas{
            display:none;
            border:1px solid #000;
        }
        
        /* 第三页样式 */
        #dialoguePage{
            display:none;
            flex-direction:column;
            align-items:center;
            gap:20px;
            width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 5px;
            width: 20%;
        }
        
        .story-area {
            width: 100%;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .choices-area {
            width: 100%;
        }
        
        .choice-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
        }
        
        .choice-btn:hover {
            background: #f0f0f0;
        }
        
        .custom-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            min-height: 60px;
        }
        
        .action-btn {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }
        
        .back-btn {
            background: #6c757d;
        }
    </style>
</head>
<body>
    <!-- 设置按钮和画布 -->
    <div id="mainPage">
        <button id="mainButton">请选择</button>
    </div>
    
    <div id="newPage">
        <button id="uploadButton">请输入图片</button>
        <button id="drawButton">请自己画画</button>
        <canvas id="canvas" width="500" height="500"></canvas>
        
        <!-- 添加确认按钮 -->
        <button id="confirmButton" style="display:none; padding:10px 20px; margin-top:10px;">
            确认并进入故事
        </button>
        
        <button id="backButton1" style="padding:10px 20px; margin-top:10px;">返回首页</button>
    </div>
    
    <!-- 第三页：对话界面 -->
    <div id="dialoguePage">
        <h2>故事发展</h2>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div>步骤: <span id="currentStep">1</span>/5</div>
        
        <div class="story-area">
            <h3>当前故事:</h3>
            <div id="storyText">从前，有一只可爱的小猫在树下玩耍...</div>
            <button id="playAudio" style="margin-top:10px; padding:5px 10px;">播放语音</button>
        </div>
        
        <div class="story-area">
            <h3>故事插画:</h3>
            <div style="text-align:center; padding:20px; background:white; border:1px solid #ddd;">
                插画显示区域
            </div>
        </div>
        
        <div class="choices-area">
            <h3>选择故事方向:</h3>
            <button class="choice-btn" data-choice="1">小猫遇到了神奇的小精灵</button>
            <button class="choice-btn" data-choice="2">树下发现了一个宝藏地图</button>
            <button class="choice-btn" data-choice="3">突然下起了彩虹雨</button>
            
            <textarea class="custom-input" placeholder="或者输入你自己的故事想法..."></textarea>
            
            <div style="text-align:center; margin-top:15px;">
                <button class="action-btn" id="confirmChoice">确认选择</button>
                <button class="action-btn back-btn" id="backButton2">返回画图</button>
            </div>
        </div>
    </div>

    <script>
        //dom获取
        const mainButton=document.getElementById('mainButton');
        const newPage=document.getElementById('newPage');
        const uploadButton=document.getElementById('uploadButton');
        const drawButton=document.getElementById('drawButton');
        const canvas=document.getElementById('canvas');
        const ctx=canvas.getContext('2d');
        const confirmButton=document.getElementById('confirmButton');
        const backButton1=document.getElementById('backButton1');
        const dialoguePage=document.getElementById('dialoguePage');
        const backButton2=document.getElementById('backButton2');
        const confirmChoice=document.getElementById('confirmChoice');
        const playAudio=document.getElementById('playAudio');

        // 故事状态
        let storyState = {
            currentStep: 1,
            totalSteps: 5,
            story: "从前，有一只可爱的小猫在树下玩耍..."
        };

        //点击'请选择'按钮之后，隐藏旧页面，弹出新页面 
        mainButton.addEventListener('click',function(){
            document.getElementById('mainPage').style.display='none';
            newPage.style.display='flex';
        });

        //给'请输入图片'按钮绑定点击事件
        uploadButton.addEventListener('click',function(){
            const input=document.createElement('input');
            input.type='file';
            input.accept='image/*';
            input.onchange=e=>{
                const file=e.target.files[0];
                const reader=new FileReader();
                reader.onload=function(event){
                    const img=new Image();
                    img.onload=function(){
                        ctx.clearRect(0,0,canvas.width,canvas.height);
                        ctx.drawImage(img,0,0,canvas.width,canvas.height);
                        confirmButton.style.display='block';
                    }
                    img.src=event.target.result;
                }
                reader.readAsDataURL(file);
            }
            input.click();
        });

        //给'请自己画画'绑定事件
        drawButton.addEventListener('click',function(){
            canvas.style.display='block';
            ctx.clearRect(0,0,canvas.width,canvas.height);
            let painting=false;
            
            function startPosition(e){
                painting=true;
                draw(e);
            }
            
            function endPosition(){
                painting=false;
                ctx.beginPath();
                confirmButton.style.display='block';
            }
            
            function draw(e){
                if (!painting) return;
                ctx.lineWidth=5;
                ctx.lineCap='round';
                ctx.strokeStyle='black';

                ctx.lineTo(e.clientX-canvas.offsetLeft,e.clientY-canvas.offsetTop);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX-canvas.offsetLeft,e.clientY-canvas.offsetTop);
            }
            
            canvas.addEventListener('mousemove',draw);
            canvas.addEventListener('mousedown',startPosition);
            canvas.addEventListener('mouseup',endPosition);
            canvas.addEventListener('mouseout',endPosition);
        });

        // 确认按钮点击事件 - 进入第三页
        confirmButton.addEventListener('click', function(){
            newPage.style.display = 'none';
            dialoguePage.style.display = 'flex';
            updateProgress();
        });

        // 返回按钮事件
        backButton1.addEventListener('click', function(){
            newPage.style.display = 'none';
            document.getElementById('mainPage').style.display = 'flex';
        });

        backButton2.addEventListener('click', function(){
            dialoguePage.style.display = 'none';
            newPage.style.display = 'flex';
        });

        // 选择剧情选项
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除其他按钮的选中状态
                document.querySelectorAll('.choice-btn').forEach(b => {
                    b.style.background = 'white';
                });
                // 设置当前按钮为选中状态
                this.style.background = '#e3f2fd';
            });
        });

        // 确认选择
        confirmChoice.addEventListener('click', function() {
            storyState.currentStep++;
            if (storyState.currentStep > storyState.totalSteps) {
                alert('故事完成！即将生成视频...');
                // 这里可以添加跳转到第四页的代码
            } else {
                updateProgress();
                alert('选择已确认！故事继续发展...');
            }
        });

        // 播放语音
        playAudio.addEventListener('click', function() {
            alert('播放故事语音...');
        });

        // 更新进度条
        function updateProgress() {
            const progressFill = document.getElementById('progressFill');
            const currentStepElem = document.getElementById('currentStep');
            const progress = (storyState.currentStep / storyState.totalSteps) * 100;
            
            progressFill.style.width = progress + '%';
            currentStepElem.textContent = storyState.currentStep;
        }

        // 初始化进度
        updateProgress();
    </script>
</body>
</html>
